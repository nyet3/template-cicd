apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: template-cicd
data:
  ENVIRONMENT: "production"
  SERVER_HOST: "0.0.0.0"
  SERVER_PORT: "8080"
  RUST_LOG: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: template-cicd
data:
  realm-export.json: |
    {
      "realm": "testrealm",
      "enabled": true,
      "sslRequired": "none",
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "editUsernameAllowed": false,
      "clients": [
        {
          "clientId": "backend-client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "directAccessGrantsEnabled": true,
          "serviceAccountsEnabled": true,
          "authorizationServicesEnabled": false,
          "redirectUris": ["*"],
          "webOrigins": ["*"]
        },
        {
          "clientId": "frontend-client",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": true,
          "directAccessGrantsEnabled": false,
          "standardFlowEnabled": true,
          "implicitFlowEnabled": false,
          "redirectUris": [
            "http://localhost:5173/*",
            "https://localhost:5173/*",
            "http://localhost:3000/*",
            "https://localhost:3000/*",
            "https://app.example.com/*"
          ],
          "webOrigins": ["+"]
        }
      ],
      "users": [
        {
          "username": "testuser",
          "enabled": true,
          "email": "test@example.com",
          "firstName": "Test",
          "lastName": "User",
          "credentials": [
            {
              "type": "password",
              "value": "testpass123"
            }
          ],
          "realmRoles": ["user"]
        }
      ],
      "roles": {
        "realm": [
          {
            "name": "user",
            "description": "User role"
          },
          {
            "name": "admin",
            "description": "Admin role"
          }
        ]
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: template-cicd
data:
  VITE_AUTH_ENABLED: "true"
  VITE_OIDC_AUTHORITY: "https://localhost:3000/realms/testrealm"
  VITE_OIDC_CLIENT_ID: "frontend-client"
  VITE_OIDC_REDIRECT_URI: "https://localhost:3000/callback"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: template-cicd
data:
  default.conf: |
    # HTTPS server configuration
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name _;
        
        ssl_certificate /etc/nginx/ssl/tls.crt;
        ssl_certificate_key /etc/nginx/ssl/tls.key;
        
        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /realms {
            proxy_pass https://keycloak:8443;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:3000;
            proxy_set_header X-Forwarded-Port 3000;
        }

        location /resources {
            proxy_pass https://keycloak:8443;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
            proxy_set_header Host $host:3000;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:3000;
            proxy_set_header X-Forwarded-Port 3000;
        }

        location /js {
            proxy_pass https://keycloak:8443;
            proxy_ssl_verify off;
            proxy_http_version 1.1;
        }

        location /health {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        
        location / {
            return 301 https://$host$request_uri;
        }
    }
