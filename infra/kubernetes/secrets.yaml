apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: template-cicd
type: Opaque
stringData:
  DATABASE_URL: "sqlite::memory:"
  OIDC_ISSUER_URL: "https://keycloak:8443/realms/testrealm"
  OIDC_CLIENT_ID: "backend-client"
---
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  namespace: template-cicd
type: Opaque
stringData:
  VITE_API_URL: ""
  VITE_OIDC_AUTHORITY: "https://localhost:3000/realms/testrealm"
  VITE_OIDC_CLIENT_ID: "frontend-client"
---
# NOTE: TLS secrets should be created using kubectl:
# 1. Generate certificates: ./generate-k8s-certs.sh
# 2. Create secrets:
#    kubectl create secret tls frontend-tls \
#      --cert=k8s-certs/frontend.crt --key=k8s-certs/frontend.key -n template-cicd
#    kubectl create secret tls keycloak-tls \
#      --cert=k8s-certs/keycloak.crt --key=k8s-certs/keycloak.key -n template-cicd
