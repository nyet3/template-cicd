version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/testdb
      KC_DB_USERNAME: testuser
      KC_DB_PASSWORD: testpass
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
    command:
      - start-dev
    ports:
      - "8180:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb
      ENVIRONMENT: test
      OIDC_ISSUER_URL: http://keycloak:8080/realms/testrealm
      OIDC_CLIENT_ID: backend-client
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 8080
      RUST_LOG: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ../../frontend
      dockerfile: ../infra/docker/frontend.Dockerfile
    environment:
      VITE_API_URL: http://backend:8080
      VITE_AUTH_ENABLED: "true"
      VITE_OIDC_AUTHORITY: http://localhost:8180/realms/testrealm
      VITE_OIDC_CLIENT_ID: frontend-client
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
