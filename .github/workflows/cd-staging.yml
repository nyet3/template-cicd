name: CD - Deploy to Staging

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    if: secrets.REGISTRY_URL != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: secrets.REGISTRY_USERNAME != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/docker/backend.Dockerfile
          push: ${{ secrets.REGISTRY_USERNAME != '' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/backend:latest
            ${{ secrets.REGISTRY_URL }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/docker/frontend.Dockerfile
          push: ${{ secrets.REGISTRY_USERNAME != '' }}
          tags: |
            ${{ secrets.REGISTRY_URL }}/frontend:latest
            ${{ secrets.REGISTRY_URL }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always() && needs.build-and-push.result == 'success'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" > kubeconfig
          echo "KUBECONFIG=$(pwd)/kubeconfig" >> $GITHUB_ENV

      - name: Deploy to Kubernetes
        run: |
          export REGISTRY=${{ secrets.REGISTRY_URL }}
          export TAG=${{ github.sha }}

          # Replace placeholders in YAML files
          sed -i "s|\${REGISTRY}|$REGISTRY|g" infra/kubernetes/*.yaml
          sed -i "s|\${TAG}|$TAG|g" infra/kubernetes/*.yaml

          kubectl apply -f infra/kubernetes/namespace.yaml
          kubectl apply -f infra/kubernetes/configmap.yaml
          kubectl apply -f infra/kubernetes/secrets.yaml
          kubectl apply -f infra/kubernetes/backend.yaml
          kubectl apply -f infra/kubernetes/frontend.yaml
          kubectl apply -f infra/kubernetes/ingress.yaml

          kubectl rollout status deployment/backend -n template-cicd
          kubectl rollout status deployment/frontend -n template-cicd
