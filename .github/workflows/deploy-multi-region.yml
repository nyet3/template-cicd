name: Multi-Region Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_target:
        description: "Deploy target (both/primary/secondary) - Primary: Tokyo, Secondary: Osaka"
        required: false
        default: "both"
      skip_tests:
        description: "Skip tests"
        required: false
        default: "false"

env:
  AWS_REGION_PRIMARY: ap-northeast-1
  AWS_REGION_SECONDARY: ap-northeast-3
  PROJECT_NAME: template-cicd
  TERRAFORM_VERSION: 1.6.0

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.skip_tests != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run backend tests
        working-directory: ./backend
        run: cargo test --release

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: ./frontend
        run: npm test

  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (Primary)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_PRIMARY }}

      - name: Login to Amazon ECR (Primary)
        id: login-ecr-primary
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract metadata
        id: meta
        run: |
          echo "tags=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./infra/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr-primary.outputs.registry }}/${{ env.PROJECT_NAME }}/backend:${{ steps.meta.outputs.tags }}
            ${{ steps.login-ecr-primary.outputs.registry }}/${{ env.PROJECT_NAME }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./infra/docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr-primary.outputs.registry }}/${{ env.PROJECT_NAME }}/frontend:${{ steps.meta.outputs.tags }}
            ${{ steps.login-ecr-primary.outputs.registry }}/${{ env.PROJECT_NAME }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.date }}
            VCS_REF=${{ github.sha }}

  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_PRIMARY }}

      - name: Terraform Init
        working-directory: ./infra/terraform/multi-region
        run: terraform init

      - name: Terraform Plan
        working-directory: ./infra/terraform/multi-region
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: infra/terraform/multi-region/tfplan
          retention-days: 1

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: terraform-plan
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_PRIMARY }}

      - name: Terraform Init
        working-directory: ./infra/terraform/multi-region
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v3
        with:
          name: tfplan
          path: infra/terraform/multi-region

      - name: Terraform Apply
        working-directory: ./infra/terraform/multi-region
        run: terraform apply -auto-approve tfplan

  deploy-primary:
    name: Deploy to Primary Region
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-and-push]
    if: always() && needs.terraform-apply.result == 'success' && (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'primary' || github.event.inputs.deploy_target == '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_PRIMARY }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION_PRIMARY }} --name ${{ env.PROJECT_NAME }}-cluster-apne1

      - name: Deploy to Primary EKS
        run: |
          kubectl apply -f infra/kubernetes/namespace.yaml
          kubectl apply -f infra/kubernetes/configmap.yaml
          kubectl apply -f infra/kubernetes/secrets.yaml
          kubectl apply -f infra/kubernetes/backend.yaml
          kubectl apply -f infra/kubernetes/frontend.yaml
          kubectl apply -f infra/kubernetes/keycloak.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/backend -n template-cicd --timeout=5m
          kubectl rollout status deployment/frontend -n template-cicd --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n template-cicd
          kubectl get services -n template-cicd

  deploy-secondary:
    name: Deploy to Secondary Region
    runs-on: ubuntu-latest
    needs: [terraform-apply, build-and-push]
    if: always() && needs.terraform-apply.result == 'success' && (github.event.inputs.deploy_target == 'both' || github.event.inputs.deploy_target == 'secondary' || github.event.inputs.deploy_target == '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_SECONDARY }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION_SECONDARY }} --name ${{ env.PROJECT_NAME }}-cluster-oska

      - name: Deploy to Secondary EKS
        run: |
          kubectl apply -f infra/kubernetes/namespace.yaml
          kubectl apply -f infra/kubernetes/configmap.yaml
          kubectl apply -f infra/kubernetes/secrets.yaml
          kubectl apply -f infra/kubernetes/backend.yaml
          kubectl apply -f infra/kubernetes/frontend.yaml
          kubectl apply -f infra/kubernetes/keycloak.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/backend -n template-cicd --timeout=5m
          kubectl rollout status deployment/frontend -n template-cicd --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n template-cicd
          kubectl get services -n template-cicd

  health-check:
    name: Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: [deploy-primary, deploy-secondary]
    if: always()
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION_PRIMARY }}

      - name: Check Primary Region Health
        if: needs.deploy-primary.result == 'success'
        run: |
          PRIMARY_ALB=$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION_PRIMARY }} --names ${{ env.PROJECT_NAME }}-alb-apne1 --query 'LoadBalancers[0].DNSName' --output text)
          echo "Primary ALB: $PRIMARY_ALB"
          # curl -f http://$PRIMARY_ALB/health || echo "Primary health check failed"

      - name: Check Secondary Region Health
        if: needs.deploy-secondary.result == 'success'
        run: |
          SECONDARY_ALB=$(aws elbv2 describe-load-balancers --region ${{ env.AWS_REGION_SECONDARY }} --names ${{ env.PROJECT_NAME }}-alb-usw2 --query 'LoadBalancers[0].DNSName' --output text)
          echo "Secondary ALB: $SECONDARY_ALB"
          # curl -f http://$SECONDARY_ALB/health || echo "Secondary health check failed"

      - name: Check Route53 Health Checks
        run: |
          aws route53 list-health-checks --query 'HealthChecks[?contains(Tags[?Key==`Project`].Value, `template-cicd`)].[Id,HealthCheckConfig.FullyQualifiedDomainName]' --output table

  notify:
    name: Send Notification
    runs-on: ubuntu-latest
    needs: [deploy-primary, deploy-secondary, health-check]
    if: always()
    steps:
      - name: Deployment Summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Region**: ${{ needs.deploy-primary.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secondary Region**: ${{ needs.deploy-secondary.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Check**: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Commit Info" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Author**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Message**: ${{ github.event.head_commit.message }}" >> $GITHUB_STEP_SUMMARY
